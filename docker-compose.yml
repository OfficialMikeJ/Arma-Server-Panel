# Arma Server Panel
#
#   docker compose up -d --build && docker compose up -d
#
# No reverse proxy is included. The web app and API publish plain HTTP ports on
# the host, for an existing proxy (Nginx Proxy Manager, Traefik, etc.) to sit in
# front of - or for direct LAN access while testing.
#
# Ports are set in .env:  WEB_HOST_PORT / API_HOST_PORT

name: arma-server-panel

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "32m"
      max-file: "3"

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arma_server_panel
      POSTGRES_USER: asp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published: only the API talks to it, over the internal network.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp -d arma_server_panel"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    # The API runs as an unprivileged user, so it needs the host's docker group
    # to reach /var/run/docker.sock. The gid differs per distribution - find
    # yours with:  stat -c '%g' /var/run/docker.sock
    group_add:
      - ${DOCKER_GID:-999}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://asp:${POSTGRES_PASSWORD}@postgres:5432/arma_server_panel?schema=public
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      HASH_PEPPER: ${HASH_PEPPER:?HASH_PEPPER is required}
      DATA_ROOT: /var/lib/arma-server-panel/servers
      DOCKER_SOCKET: /var/run/docker.sock
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      STEAM_USERNAME: ${STEAM_USERNAME:-}
      STEAM_PASSWORD: ${STEAM_PASSWORD:-}
      PUBLIC_GAME_HOST: ${PUBLIC_GAME_HOST:-}
      RELAY_ENABLED: ${RELAY_ENABLED:-false}
      RELAY_ENDPOINT: ${RELAY_ENDPOINT:-}
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      # Set true only when a proxy you control fronts this, and list its subnet
      # in TRUSTED_PROXY_CIDRS - otherwise X-Forwarded-For is forgeable and
      # every rate limit and audit entry becomes untrustworthy.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      REQUIRE_SECURE_COOKIES: ${REQUIRE_SECURE_COOKIES:-true}
      GAME_IMAGE_ROOT: /opt/asp/docker
    volumes:
      # Required to create and supervise game containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT:-./data/servers}:/var/lib/arma-server-panel/servers
      # Build contexts for the game images. The panel builds an image the first
      # time a server of that game is created, so it needs the Dockerfiles.
      # Read-only: the panel builds from these, it never writes to them.
      - ./docker:/opt/asp/docker:ro
    ports:
      - "${API_HOST_PORT:-3004}:4000"
    networks:
      - internal
      - edge

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next's standalone server binds to $HOSTNAME, which Docker sets to the
      # container id. That makes it listen on a single interface, and forwarded
      # connections get reset. Force it to listen on all interfaces.
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "${WEB_HOST_PORT:-3002}:3000"
    networks:
      - internal
      - edge

volumes:
  postgres-data:

networks:
  internal:
    internal: true
  edge:
